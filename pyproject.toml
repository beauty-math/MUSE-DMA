[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-dma"
version = "1.0.0"
description = "Multi-encoder unified semantic-structural embedding for drug-microbe association prediction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MUSE-DMA authors"}]
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.2",
  "scikit-learn==1.5.1",
  "scipy==1.13.1",
  "torch==2.3.1",
  "transformers==4.43.3"
]

[tool.setuptools]
packages = ["muse_dma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
